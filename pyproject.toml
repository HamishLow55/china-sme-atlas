[project]
name = "sme-atlas-analysis"
version = "0.1.0"
description = "Analysis layer on top of the SME Equipment Atlas: judgement tables, reproducible projects and provenance manifests."
requires-python = ">=3.12"
dependencies = [
    "markdown>=3.11",
    "matplotlib>=3.11.2",
    "pandas>=2.2",
]

[project.scripts]
sme-analysis = "sme_analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sme_analysis"]
